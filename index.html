<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Think Before You Click</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <h1>Tænk dig om før du klikker!</h1>

                <p>
                    Interaktiv læring om phishing og datasikkerhed
                </p>

            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div class="score-box">
                Point:
                <span id="score">0</span>
            </div>

            <div id="content">

                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop">

                <h2>Velkommen</h2>

                <p>
                    Mange studerende bliver udsat for phishing,
                    falske links og digitale scams hver dag.
                </p>

                <p>
                    I dette scenarie skal du forsøge at træffe sikre valg online.
                </p>

                <button onclick="startGame()">
                    Start scenarie
                </button>

            </div>

        </div>

    </div>

    
    <script src="js/script.js"></script>

</body>

</html>
